name: PostgreSQL restore drill
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: kudiroll_restore_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kudiroll_restore_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      KUDIROLL_ACCOUNT_BACKEND: postgres
      KUDIROLL_AUTH_BACKEND: postgres
      KUDIROLL_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/kudiroll_restore_source
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate disposable encryption key
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'KUDIROLL_DATA_ENCRYPTION_KEY=' + require('crypto').randomBytes(32).toString('base64url') + '\n')"
      - run: npm run db:migrate
      - run: node --import tsx scripts/restore-drill.ts seed
      - name: Back up and restore into a separate empty database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" pg_dump -U postgres -d kudiroll_restore_source --format=custom > output/restore-drill/database.dump
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres kudiroll_restore_target
          docker exec -i "$POSTGRES_CONTAINER" pg_restore -U postgres -d kudiroll_restore_target --exit-on-error --no-owner < output/restore-drill/database.dump
      - name: Verify the restored application state
        env:
          KUDIROLL_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/kudiroll_restore_target
        run: node --import tsx scripts/restore-drill.ts verify

      - name: Verify encrypted manual backup and local restore
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          KUDI_BACKUP_SOURCE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/kudiroll_restore_source
          KUDI_BACKUP_TARGET_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/kudiroll_recovery_encrypted
        run: |
          export KUDI_BACKUP_KEY=$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('base64url'))")
          printf '%s\n' '#!/bin/sh' 'exec docker exec -i -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE "$POSTGRES_CONTAINER" pg_dump "$@"' > output/pg-dump-wrapper.sh
          printf '%s\n' '#!/bin/sh' 'exec docker exec -i -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE "$POSTGRES_CONTAINER" pg_restore "$@"' > output/pg-restore-wrapper.sh
          chmod +x output/pg-*-wrapper.sh
          export PG_DUMP_BIN="$PWD/output/pg-dump-wrapper.sh"
          export PG_RESTORE_BIN="$PWD/output/pg-restore-wrapper.sh"
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres kudiroll_recovery_encrypted
          node --import tsx scripts/manual-backup.ts backup output/restore-drill/manual.enc
          node --import tsx scripts/manual-backup.ts verify output/restore-drill/manual.enc
